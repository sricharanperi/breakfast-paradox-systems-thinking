<rect x="220.0" y="108.0" width="1700" height="100" rx="12" fill="white" stroke="#0d47a1" stroke-width="2.4"/><text x="1070.0" y="154.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1b1b">A 48 rupee breakfast, booked and skipped almost every day</text><text x="1070.0" y="173.0" text-anchor="middle" font-size="12" fill="#3a3a3a">plus a frog in the biryani, a tightened cancellation cap, and a fix already run twice</text>
<rect x="220.0" y="255.0" width="1700" height="100" rx="12" fill="white" stroke="#0d47a1" stroke-width="2.4"/><text x="1070.0" y="301.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1b1b">Registration beats attendance every month, worst at breakfast</text><text x="1070.0" y="320.0" text-anchor="middle" font-size="12" fill="#3a3a3a">no one interviewed ever got value from Skip Meal, and complaints sit until an incident forces a response</text>
<rect x="110.0" y="460.0" width="430" height="150" rx="12" fill="#eaf2fb" stroke="#0d3b66" stroke-width="2.4"/><text x="325.0" y="531.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1b1b">Billing fires at</text><text x="325.0" y="550.0" text-anchor="middle" font-size="12" fill="#3a3a3a">registration, not consumption</text>
<rect x="560.0" y="460.0" width="430" height="150" rx="12" fill="#eaf2fb" stroke="#0d3b66" stroke-width="2.4"/><text x="775.0" y="531.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1b1b">Decision rights split</text><text x="775.0" y="550.0" text-anchor="middle" font-size="12" fill="#3a3a3a">four ways, no single owner</text>
<rect x="1010.0" y="460.0" width="430" height="150" rx="12" fill="#eaf2fb" stroke="#0d3b66" stroke-width="2.4"/><text x="1225.0" y="531.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1b1b">Feedback triages by</text><text x="1225.0" y="550.0" text-anchor="middle" font-size="12" fill="#3a3a3a">how loud, not what it costs</text>
<rect x="1460.0" y="460.0" width="430" height="150" rx="12" fill="#eaf2fb" stroke="#0d3b66" stroke-width="2.4"/><text x="1675.0" y="531.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1b1b">Skip Meal pays the</text><text x="1675.0" y="550.0" text-anchor="middle" font-size="12" fill="#3a3a3a">student nothing back</text>
<rect x="140.0" y="775.0" width="560" height="150" rx="12" fill="white" stroke="#ffca28" stroke-width="2.4"/><text x="420.0" y="846.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0d3b66">Registration count is treated</text><text x="420.0" y="865.0" text-anchor="middle" font-size="12" fill="#3a3a3a">as close enough to real demand</text>
<rect x="720.0" y="775.0" width="560" height="150" rx="12" fill="white" stroke="#ffca28" stroke-width="2.4"/><text x="1000.0" y="846.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0d3b66">Planning certainty is worth more</text><text x="1000.0" y="865.0" text-anchor="middle" font-size="12" fill="#3a3a3a">than accuracy, as a fixed default</text>
<rect x="1300.0" y="775.0" width="560" height="150" rx="12" fill="white" stroke="#ffca28" stroke-width="2.4"/><text x="1580.0" y="846.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0d3b66">A meal everyone should</text><text x="1580.0" y="865.0" text-anchor="middle" font-size="12" fill="#3a3a3a">default into unless they opt out</text>
